plugins {
    id 'com.android.application'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.isFile()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

def hostedApiUrl = 'https://shuttle-server-wh1z.onrender.com/api'
def debugApiUrl = providers.gradleProperty('shuttleApiBaseUrl')
        .orElse(providers.environmentVariable('SHUTTLE_API_BASE_URL'))
        .orElse(localProperties.getProperty('shuttleApiBaseUrl', ''))
        .get().trim()

android {
    namespace 'com.shuttle.mobile'
    compileSdk 34

    defaultConfig {
        applicationId "com.shuttle.mobile"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.0.1"

        buildConfigField 'String', 'API_BASE_URL', "\"${hostedApiUrl}\""
    }

    buildTypes {
        debug {
            if (debugApiUrl) {
                def uri = new URI(debugApiUrl)
                if (!(uri.scheme?.toLowerCase(Locale.ROOT) in ['http', 'https']) || !uri.host ||
                        uri.rawUserInfo != null || uri.rawQuery != null || uri.rawFragment != null ||
                        uri.port == 0 || uri.port > 65535 || !(uri.rawPath.replaceAll('/+$', '') in ['', '/api'])) {
                    throw new GradleException('shuttleApiBaseUrl must be an HTTP(S) server root or /api address')
                }
                buildConfigField 'String', 'API_BASE_URL', "\"${debugApiUrl}\""
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':common')
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
}
